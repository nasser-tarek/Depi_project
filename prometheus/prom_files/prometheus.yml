global:
  scrape_interval: 15s    

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alert_manager:9093'

rule_files:
  - 'alert-rules.yaml'

scrape_configs:
 
  - job_name: 'node master'
    static_configs:
      - targets:
          - '16.16.184.111:9100'   


  - job_name: 'node worker'
    static_configs:
      - targets:
          - '13.60.10.130:9100'   
